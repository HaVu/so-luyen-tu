name: Nhắc học mỗi ngày
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nhac-nho
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: nhac-nho
      - run: node gui.js
        working-directory: nhac-nho
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
